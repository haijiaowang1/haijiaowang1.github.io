<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站整改中</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family: "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg,#1f1f1f,#2d2d2d);
        color:#fff;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        overflow:hidden;
    }

    .box{
        width:90%;
        max-width:600px;
        text-align:center;
        background:rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        padding:50px 30px;
        border-radius:20px;
        border:1px solid rgba(255,255,255,0.1);
        box-shadow:0 0 30px rgba(0,0,0,0.4);
        animation:fadeIn 1s ease;
    }

    .icon{
        font-size:70px;
        margin-bottom:20px;
        animation:float 2s ease-in-out infinite;
    }

    h1{
        font-size:36px;
        margin-bottom:15px;
        letter-spacing:2px;
    }

    p{
        font-size:16px;
        color:#ccc;
        line-height:1.8;
    }

    .time{
        margin-top:25px;
        color:#999;
        font-size:14px;
    }

    @keyframes float{
        0%,100%{
            transform:translateY(0);
        }
        50%{
            transform:translateY(-10px);
        }
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(30px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }
</style>
</head>
<body>

<div class="box">
    <div class="icon">🚧</div>
    <h1>网站整改中</h1>
    <p>
        为进一步优化网站内容与访问体验，<br>
        当前正在进行系统升级与内容整改。<br>
        给您带来的不便敬请谅解。
    </p>

    <div class="time">
        请稍后访问
    </div>
</div>

</body>
</html>
